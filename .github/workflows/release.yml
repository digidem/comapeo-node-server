name: Release

on:
  workflow_dispatch:
    inputs:
      semver:
        description: The semver to use
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - prerelease
          - prepatch
          - preminor
          - premajor
  pull_request:
    types: [closed]

jobs:
  release:
    # Prereleases may run from any branch; everything else only from the
    # default branch, or when optic's own release PR is merged
    if: >-
      ${{
        (
          startsWith(github.event.inputs.semver, 'pre') ||
          github.ref == format(
            'refs/heads/{0}',
            github.event.repository.default_branch
          )
        ) &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.user.login == 'optic-release-automation[bot]'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: nearform-actions/optic-release-automation-action@212ac6a8d5c859eb7683ddb3dbbbd52a6084f30c # v4.13.0
        with:
          commit-message: 'chore: release {version}'
          sync-semver-tags: false
          access: public
          # e.g. v3.0.0-pre.0
          prerelease-prefix: pre
          semver: ${{ github.event.inputs.semver }}
          npm-tag: ${{ startsWith(github.event.inputs.semver, 'pre') && 'next' || 'latest' }}
          notify-linked-issues: false
          publish-mode: oidc
          build-command: |
            npm ci
