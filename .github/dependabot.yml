version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before proposing them (supply-chain hygiene)
    cooldown:
      default-days: 7
    ignore:
      # Tracks the engines floor, so newer Node APIs aren't used by accident;
      # bump it together with engines.node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint's peer range stops at <6.1.0; lift when it supports TS 7
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
